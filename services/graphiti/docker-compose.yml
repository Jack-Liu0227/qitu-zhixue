services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${GRAPHITI_NEO4J_PASSWORD:?set GRAPHITI_NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - graphiti_neo4j_data:/data
      - graphiti_neo4j_logs:/logs

  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; request=urllib.request.Request('http://127.0.0.1:4180/health', headers={'Authorization': 'Bearer '+os.environ['QITU_GRAPHITI_TOKEN']}); urllib.request.urlopen(request, timeout=5).close()"
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:4180:4180"
    environment:
      QITU_GRAPHITI_TOKEN: "${QITU_GRAPHITI_TOKEN:?set QITU_GRAPHITI_TOKEN}"
      GRAPHITI_NEO4J_URI: bolt://neo4j:7687
      GRAPHITI_NEO4J_USER: neo4j
      GRAPHITI_NEO4J_PASSWORD: "${GRAPHITI_NEO4J_PASSWORD:?set GRAPHITI_NEO4J_PASSWORD}"
      GRAPHITI_TELEMETRY_ENABLED: "false"

volumes:
  graphiti_neo4j_data:
  graphiti_neo4j_logs:
