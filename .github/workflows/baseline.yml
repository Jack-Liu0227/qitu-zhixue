name: qitu-zhixue-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f AGENTS.md
          test -f CONTRIBUTING.md
          test -f docs/README.md
          test -f docs/admin/ADMIN.md
          test -f docs/student/STUDENT.md
          test -f docs/teacher/TEACHER.md
          test -f docs/parent/PARENT.md
          test -f docs/sdk/SDK.md
          test -f docs/shared/ARCHITECTURE.md
          test -f docs/shared/DATABASE.md
          test -f package.json
          test -f pnpm-workspace.yaml
          for dir in apps packages services database docs tooling; do
            test -d "$dir"
          done
          if find . -type f \( -name '*.pem' -o -name '*.key' -o -name 'auth.json' \) | grep -q .; then
            echo 'Credential-like file detected'
            exit 1
          fi
          echo 'Repository baseline OK'

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
